<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Result validation system</title>
  <desc id="desc">An original diagram showing a numerical result surrounded by constraint, reproducibility, sensitivity, and unit checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17122b"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6287cc" stop-opacity=".08"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="42" cy="36" r="5" fill="#ef6a6a"/>
  <circle cx="60" cy="36" r="5" fill="#eabf55"/>
  <circle cx="78" cy="36" r="5" fill="#55d68a"/>
  <text x="360" y="42" fill="#e9e6ff" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" letter-spacing="2">RESULT AUDIT</text>

  <g opacity=".5" stroke="#3d3d68" stroke-width="2" stroke-dasharray="6 8">
    <path d="M360 210 188 122"/><path d="M360 210 532 122"/>
    <path d="M360 210 188 298"/><path d="M360 210 532 298"/>
  </g>

  <circle cx="360" cy="210" r="104" fill="url(#core)"/>
  <circle cx="360" cy="210" r="72" fill="#151a31" stroke="#8178e8" stroke-width="3" filter="url(#glow)"/>
  <text x="360" y="194" fill="#9fa8c8" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.5">FINAL VALUE</text>
  <text x="360" y="230" fill="#ffffff" font-size="30" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">PASS</text>
  <text x="360" y="253" fill="#6ee7b7" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">independently recomputed</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(86 78)">
      <rect width="204" height="88" rx="18" fill="#151d34" stroke="#344568"/>
      <circle cx="34" cy="34" r="16" fill="#123b37"/><path d="m26 34 6 6 11-14" fill="none" stroke="#55d6be" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="31" fill="#ffffff" font-size="14" font-weight="700">CONSTRAINTS</text>
      <text x="60" y="52" fill="#8fa2c7" font-size="11">residual ≤ tolerance</text>
      <rect x="26" y="69" width="152" height="5" rx="2.5" fill="#2c3855"/><rect x="26" y="69" width="146" height="5" rx="2.5" fill="#55d6be"/>
    </g>
    <g transform="translate(430 78)">
      <rect width="204" height="88" rx="18" fill="#151d34" stroke="#344568"/>
      <circle cx="34" cy="34" r="16" fill="#24245a"/><path d="M25 35a10 10 0 1 1 8 9M25 35l-2-8 8 2" fill="none" stroke="#9a8cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="31" fill="#ffffff" font-size="14" font-weight="700">REPRODUCE</text>
      <text x="60" y="52" fill="#8fa2c7" font-size="11">same input · same result</text>
      <g fill="#8178e8"><circle cx="31" cy="71" r="3"/><circle cx="45" cy="71" r="3"/><circle cx="59" cy="71" r="3"/></g>
      <path d="M73 71h105" stroke="#394663" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(86 254)">
      <rect width="204" height="88" rx="18" fill="#151d34" stroke="#344568"/>
      <circle cx="34" cy="34" r="16" fill="#3a2b1b"/><path d="M24 40c7-17 12 10 20-10" fill="none" stroke="#f2bd63" stroke-width="3" stroke-linecap="round"/>
      <text x="60" y="31" fill="#ffffff" font-size="14" font-weight="700">SENSITIVITY</text>
      <text x="60" y="52" fill="#8fa2c7" font-size="11">conclusion stays stable</text>
      <path d="M26 73c31-1 43-13 65-10s34 12 87-4" fill="none" stroke="#f2bd63" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(430 254)">
      <rect width="204" height="88" rx="18" fill="#151d34" stroke="#344568"/>
      <circle cx="34" cy="34" r="16" fill="#17314d"/><path d="M25 27h18M25 34h11M25 41h15" stroke="#68b5f3" stroke-width="3" stroke-linecap="round"/>
      <text x="60" y="31" fill="#ffffff" font-size="14" font-weight="700">UNITS &amp; SCOPE</text>
      <text x="60" y="52" fill="#8fa2c7" font-size="11">commensurable evidence</text>
      <rect x="26" y="67" width="62" height="10" rx="5" fill="#1f5279"/>
      <rect x="96" y="67" width="39" height="10" rx="5" fill="#293959"/>
      <rect x="143" y="67" width="35" height="10" rx="5" fill="#293959"/>
    </g>
  </g>

  <text x="360" y="386" fill="#7776a6" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.2">TRACEABLE  ·  REPRODUCIBLE  ·  DEFENSIBLE</text>
</svg>
