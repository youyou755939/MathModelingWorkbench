<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Paper visual system</title>
  <desc id="desc">An original illustration of a polished mathematical-modeling paper page with typography, formula, chart, table, and a unified palette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#10252a"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#55d6be"/>
      <stop offset="1" stop-color="#6287cc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="720" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="42" cy="36" r="5" fill="#ef6a6a"/>
  <circle cx="60" cy="36" r="5" fill="#eabf55"/>
  <circle cx="78" cy="36" r="5" fill="#55d68a"/>
  <text x="360" y="42" fill="#def8f2" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" letter-spacing="2">PAPER SYSTEM</text>

  <g transform="translate(112 72)" filter="url(#shadow)">
    <rect width="386" height="300" rx="9" fill="#f7f8fb"/>
    <rect width="386" height="14" rx="9" fill="#6287cc"/>
    <rect y="9" width="386" height="5" fill="#6287cc"/>
    <text x="28" y="45" fill="#1c2740" font-size="17" font-family="Georgia,Times New Roman,serif" font-weight="700">3. Model and Solution</text>
    <rect x="28" y="58" width="118" height="3" rx="1.5" fill="#55bda9"/>
    <g fill="#b8c0cf">
      <rect x="28" y="75" width="325" height="5" rx="2.5"/>
      <rect x="28" y="87" width="302" height="5" rx="2.5"/>
      <rect x="28" y="99" width="332" height="5" rx="2.5"/>
      <rect x="28" y="111" width="258" height="5" rx="2.5"/>
    </g>

    <rect x="28" y="132" width="330" height="42" rx="7" fill="#eef1f7"/>
    <text x="193" y="159" fill="#314260" font-size="15" text-anchor="middle" font-family="Cambria Math,Georgia,serif" font-style="italic">min  f(x) = Σ cᵢxᵢ  ·  s.t.  Ax ≤ b</text>

    <g transform="translate(28 193)">
      <rect width="190" height="78" rx="7" fill="#eef3f7"/>
      <path d="M18 61H174M22 15v50" stroke="#acb8c8" stroke-width="1.5"/>
      <path d="M23 56 54 47 80 50 111 26 142 31 171 14" fill="none" stroke="url(#chart)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M23 56 54 47 80 50 111 26 142 31 171 14v47H23Z" fill="#55d6be" opacity=".13"/>
      <g fill="#6287cc"><circle cx="54" cy="47" r="3"/><circle cx="111" cy="26" r="3"/><circle cx="171" cy="14" r="3"/></g>
    </g>

    <g transform="translate(232 193)">
      <rect width="126" height="78" rx="7" fill="#eef3f7"/>
      <rect x="10" y="10" width="106" height="12" rx="3" fill="#dbe3ee"/>
      <g fill="#c7d1df">
        <rect x="10" y="29" width="32" height="9" rx="2"/><rect x="47" y="29" width="30" height="9" rx="2"/><rect x="82" y="29" width="34" height="9" rx="2"/>
        <rect x="10" y="43" width="32" height="9" rx="2"/><rect x="47" y="43" width="30" height="9" rx="2"/><rect x="82" y="43" width="34" height="9" rx="2"/>
        <rect x="10" y="57" width="32" height="9" rx="2"/><rect x="47" y="57" width="30" height="9" rx="2"/><rect x="82" y="57" width="34" height="9" rx="2"/>
      </g>
      <rect x="82" y="43" width="34" height="9" rx="2" fill="#88cdbf"/>
    </g>

    <rect x="28" y="283" width="205" height="4" rx="2" fill="#c4ccd8"/>
    <text x="350" y="288" fill="#8792a5" font-size="8" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif">08</text>
  </g>

  <g transform="translate(528 92)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="0" fill="#8ca6b2" font-size="11" font-weight="700" letter-spacing="1.5">VISUAL TOKENS</text>
    <g transform="translate(0 22)">
      <circle cx="13" cy="13" r="13" fill="#6287cc"/><text x="38" y="17" fill="#d9e6ed" font-size="11">Primary</text>
    </g>
    <g transform="translate(0 58)">
      <circle cx="13" cy="13" r="13" fill="#55d6be"/><text x="38" y="17" fill="#d9e6ed" font-size="11">Evidence</text>
    </g>
    <g transform="translate(0 94)">
      <circle cx="13" cy="13" r="13" fill="#f2bd63"/><text x="38" y="17" fill="#d9e6ed" font-size="11">Attention</text>
    </g>
    <rect x="0" y="143" width="126" height="1" fill="#34505a"/>
    <text x="0" y="174" fill="#8ca6b2" font-size="11" font-weight="700" letter-spacing="1.5">HIERARCHY</text>
    <rect x="0" y="189" width="112" height="9" rx="4.5" fill="#d9e6ed"/>
    <rect x="0" y="207" width="86" height="6" rx="3" fill="#90a8b4"/>
    <rect x="0" y="222" width="122" height="4" rx="2" fill="#4a6873"/>
    <rect x="0" y="234" width="103" height="4" rx="2" fill="#4a6873"/>
  </g>

  <text x="360" y="400" fill="#688b92" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.2">CLEAR  ·  CONSISTENT  ·  SUBMISSION READY</text>
</svg>
